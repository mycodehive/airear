[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airear"
version = "1.0.0"
description = "Windows WASAPI system audio to phone Safari over local WebRTC"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6==6.10.3", "aiortc==1.15.0", "aiohttp==3.13.3",
  "av==16.1.0", "numpy==2.3.5", "qrcode[pil]==8.2",
  "PyAudioWPatch==0.2.12.8; sys_platform == 'win32'",
]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-aiohttp==1.1.0", "ruff==0.15.6", "pyinstaller==6.19.0"]
[project.scripts]
airear = "airear.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
airear = ["web/*", "assets/*", "languages/*.json"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

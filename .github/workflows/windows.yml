name: Windows EXE
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          enable-cache: true
      - name: Build, test, frozen EXE smoke, checksum
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AirEar-x64
          path: |
            dist/AirEar.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload hardware acceptance checklist
        uses: actions/upload-artifact@v4
        with:
          name: validation-checklist
          path: docs/VALIDATION.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AirEar-x64
          path: dist
      - name: Publish test release; hardware validation remains explicit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/AirEar.exe dist/SHA256SUMS.txt \
            --title "AirEar $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --prerelease

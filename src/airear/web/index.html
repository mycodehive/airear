<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>AirEar · Windows Audio</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><span class="logo">◉</span><div><h1>AirEar</h1><p>컴퓨터의 소리를, 내 귀 가까이.</p></div></header><section class="card"><span class="eyebrow">WINDOWS → IPHONE</span><h2>가볍게 연결하고<br>편안하게 들어보세요.</h2><p>Windows 앱에 표시된 접속 PIN을 입력하세요.</p><label for="pin">접속 PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="16" placeholder="8자리 PIN"><button id="connect">연결하고 듣기 시작</button><button id="stop" class="secondary" disabled>연결 해제</button><div id="status" role="status" aria-live="polite">연결 대기 중</div><label for="volume">수신 음량 <output id="volumeLabel">100%</output></label><input id="volume" type="range" min="0" max="100" value="100"><audio id="audio" playsinline></audio></section><section class="tips"><h3>더 편하게 듣는 방법</h3><p>AirPods는 iPhone에 연결하세요. Windows와 iPhone은 동일한 Wi-Fi 또는 LAN에 있어야 합니다.</p><p>화면을 잠그거나 Safari를 백그라운드로 보내면 iOS 정책에 따라 재생이 중단될 수 있습니다. 다시 돌아와 듣기 버튼을 눌러주세요.</p><p id="transport"></p></section><footer>개인 LAN 전용 · 최대 4대 연결</footer></main></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>AirEar · Windows Audio</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><span class="logo">◉</span><div><h1>AirEar</h1><p data-i18n="tagline">Your PC audio. One pair of earphones.</p></div></header><label class="language-label"><span data-i18n="language">Language</span><select id="language" aria-label="Language"><option value="en">English</option><option value="ko">한국어</option></select></label><section class="card"><span class="eyebrow">WINDOWS → PHONE</span><h2 data-i18n="hero">Connect easily. Listen comfortably.</h2><p data-i18n="intro">Enter the access PIN shown in the Windows app.</p><label for="pin" data-i18n="pin">Access PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="16" placeholder="8-digit PIN"><button id="connect" data-i18n="connect">Connect and listen</button><button id="stop" class="secondary" disabled data-i18n="disconnect">Disconnect</button><div id="status" role="status" aria-live="polite">Waiting to connect</div><p data-i18n="device_volume">Adjust listening volume with your phone volume buttons.</p><audio id="audio" controls playsinline></audio></section><section class="tips"><h3 data-i18n="tips">Listen with less switching</h3><p data-i18n="earphones"></p><p data-i18n="background"></p><p id="transport"></p></section><footer data-i18n="footer">Private LAN only · Up to 4 receivers</footer></main></body></html>
